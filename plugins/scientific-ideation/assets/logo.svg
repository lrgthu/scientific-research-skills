  <!-- Surviving Pareto-optimal hypothesis spark -->
  <circle cx="36" cy="86" r="6" fill="#94A3B8"/>
  <circle cx="58" cy="64" r="6" fill="#F59E0B"/>
  <circle cx="88" cy="44" r="8" fill="#10B981" stroke="#ECFDF5" stroke-width="2.5"/>
