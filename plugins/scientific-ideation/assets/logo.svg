<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <rect x="12" y="12" width="104" height="104" rx="24" fill="#0F172A" stroke="#F59E0B" stroke-width="4"/>
  <!-- Pareto frontier curve -->
  <path d="M28 96 C 36 56, 62 34, 100 30" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 5"/>
  <!-- Branching Strong Inference hypothesis tree (H1 / H2 fork) -->
  <path d="M36 86 L58 64 M58 64 L88 44 M58 64 L88 78" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Falsified branch X -->
